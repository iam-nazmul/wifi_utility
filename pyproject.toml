[project]
name = "wifi-utility"
version = "0.1.0"
description = "Detect motion from a Mac's WiFi link to its router (home security and policy-gated workplace occupancy)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "iam-nazmul", email = "nazmul.cse48@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyobjc-framework-CoreWLAN>=10.0; sys_platform == 'darwin'",
    "rumps>=0.4; sys_platform == 'darwin'",
]

[project.scripts]
wifi-utility = "wifi_utility.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wifi_utility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
